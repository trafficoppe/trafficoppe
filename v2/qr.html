<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Code แบบคำขอดูกล้องวงจรปิด แยกหน่วยงาน</title>
<style>
body{font-family:"Sarabun","Noto Sans Thai",Tahoma,sans-serif;margin:0;background:#f4f6fa;color:#14213d}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px}
h1{font-size:22px;margin:0 0 4px;color:#0f2d5c}.sub{color:#55607a;font-size:14px;margin:0 0 16px}
.base{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.base input{flex:1;min-width:260px;padding:9px 10px;border:1px solid #cfd6e4;border-radius:8px;font:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.card{background:#fff;border:1px solid #d8deea;border-radius:14px;padding:18px;text-align:center;break-inside:avoid}
.card h2{font-size:17px;margin:0 0 2px}.card .en{font-size:13px;color:#55607a;margin-bottom:12px}
.qr{display:inline-block;padding:10px;background:#fff;border:1px solid #e3e7ef;border-radius:10px}
.url{font-size:12px;word-break:break-all;margin-top:10px;color:#1d4f91}
button{font:inherit;padding:9px 14px;border-radius:8px;border:1px solid #0f2d5c;background:#0f2d5c;color:#fff;cursor:pointer}
@media print{.base,.sub,button{display:none}body{background:#fff}.card{border:1px solid #999}}
</style>
</head>
<body>
<div class="wrap">
  <h1>QR Code แบบคำขอดูกล้องวงจรปิด แยกหน่วยงาน</h1>
  <p class="sub">ตรวจที่อยู่เว็บด้านล่างให้ตรงกับที่อยู่จริงของแบบฟอร์มก่อนพิมพ์ — QR จะสร้างใหม่ทันทีเมื่อแก้ไข</p>
  <div class="base"><input id="base" aria-label="ที่อยู่หน้าแบบฟอร์ม"><button id="print" type="button">พิมพ์หน้านี้</button></div>
  <div class="grid" id="grid"></div>
</div>
<script src="units.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function () {
  var base = document.getElementById('base'), grid = document.getElementById('grid');
  base.value = location.href.replace(/qr\.html.*$/, 'index.html');
  function draw() {
    grid.textContent = '';
    (window.CCTV_UNITS || []).forEach(function (u) {
      var url = base.value.split('?')[0] + '?unit=' + u.slug, card = document.createElement('div'); card.className = 'card';
      var h = document.createElement('h2'); h.textContent = u.nameTh; var en = document.createElement('div'); en.className = 'en'; en.textContent = u.nameEn;
      var q = document.createElement('div'); q.className = 'qr'; var t = document.createElement('div'); t.className = 'url'; t.textContent = url;
      card.appendChild(h); card.appendChild(en); card.appendChild(q); card.appendChild(t); grid.appendChild(card);
      if (window.QRCode) new QRCode(q, { text: url, width: 200, height: 200, correctLevel: QRCode.CorrectLevel.M });
      else q.textContent = 'โหลดตัวสร้าง QR ไม่สำเร็จ — ใช้ที่อยู่เว็บด้านล่างแทน';
    });
  }
  base.addEventListener('input', draw); document.getElementById('print').addEventListener('click', function () { window.print(); }); draw();
})();
</script>
</body>
</html>
